# ─── En-têtes de sécurité (défense en profondeur) ───
# Remarque CSP : le site utilise massivement des attributs onclick="" et des
# <script>/<style> inline, ce qui impose 'unsafe-inline' pour script-src et
# style-src (refactoriser vers des nonces/addEventListener sortirait du cadre
# de ce correctif). La CSP reste néanmoins utile : elle empêche le chargement
# de scripts depuis un domaine tiers non listé et, surtout, verrouille
# connect-src pour qu'un éventuel payload XSS ne puisse pas exfiltrer des
# données (fetch/XHR/WebSocket) vers un serveur arbitraire.
# frame-src / media-src / worker-src / blob: : sans eux, default-src 'self' bloquait
# les vidéos YouTube/TikTok/Vimeo, les vidéos hébergées sur Supabase, les aperçus
# de photos/vidéos avant envoi (URL blob:) et le worker de conversion HEIC (iPhone).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://svjkpexgckghrtrfowtq.supabase.co; frame-src https://www.youtube.com https://www.tiktok.com https://player.vimeo.com; worker-src 'self' blob:; connect-src 'self' https://svjkpexgckghrtrfowtq.supabase.co wss://svjkpexgckghrtrfowtq.supabase.co https://nominatim.openstreetmap.org; form-action 'self'"

# ─── App Android (Play Store) : fichier de vérification Digital Asset Links ───
# Android le télécharge pour prouver que l'app be.immolibre.twa appartient bien
# à immolibre.be (sinon une barre d'adresse s'affiche en haut de l'app).
# Le fichier est rangé à la racine (/assetlinks.json) car le glisser-déposer
# Netlify ignore les dossiers cachés comme .well-known ; la réécriture 200
# ci-dessous le sert à l'adresse attendue par Android (sans redirection).
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/assetlinks.json"
  status = 200
  force = true

# ─── Canonicalisation domaine : www → apex (immolibre.be) ───
